<!doctype html>
<html lang="vi" class="h-full bg-slate-950">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng Nhập Quản Trị - Capital Circle</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="./js/config.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Plus Jakarta Sans", "sans-serif"],
            },
            colors: {
              brand: {
                gold: "#D4AF37",
                navy: "#0F172A",
                blue: "#0284C7",
              },
            },
          },
        },
      };
    </script>
  </head>
  <body
    class="h-full font-sans antialiased text-slate-200 flex flex-col justify-between selection:bg-amber-500 selection:text-slate-950"
  >
    <!-- Header Section -->
    <header
      class="w-full border-b border-slate-800/80 bg-[#0b101d] backdrop-blur-md px-6 py-4"
    >
      <div class="max-w-7xl mx-auto flex items-center justify-between">
        <a class="flex items-center gap-3" href="./index.html">
          <!-- Brand Logo Icon -->
          <div
            class="w-10 h-10 bg-slate-900 border border-slate-700 rounded-full flex items-center justify-center font-bold text-amber-400 text-sm shadow-md"
          >
            CC
          </div>
          <!-- Brand Name -->
          <div>
            <span
              class="block text-base font-extrabold tracking-wider uppercase text-white leading-none"
              >CAPITAL CIRCLE</span
            >
            <span
              class="block text-[9px] uppercase tracking-[0.2em] font-medium text-slate-400 mt-1"
              >KIẾN THỨC • TƯ DUY • GIÁ TRỊ DÀI HẠN</span
            >
          </div>
        </a>
      </div>
    </header>

    <!-- Main Login Card Section -->
    <main class="flex-1 flex items-center justify-center px-4 py-12">
      <div class="w-full max-w-md">
        <!-- Form Title -->
        <div class="text-center mb-8">
          <span
            class="inline-block px-3 py-1 text-xs font-semibold tracking-widest text-amber-400 uppercase bg-amber-400/10 border border-amber-400/20 rounded-full mb-3"
          >
            Hệ Thống Quản Trị
          </span>
          <h1 class="text-3xl font-serif font-bold text-white tracking-tight">
            Đăng nhập
          </h1>
          <p class="text-sm text-slate-400 mt-2">
            Vui lòng nhập tài khoản quản trị viên để tiếp tục
          </p>
        </div>

        <!-- Login Form Card -->
        <div
          class="bg-slate-900/80 border border-slate-800 rounded-2xl p-8 shadow-2xl backdrop-blur-xl relative"
        >
          <form class="space-y-6" id="loginForm">
            <!-- Email Input -->
            <div>
              <label
                for="email"
                class="block text-xs font-medium text-slate-300 uppercase tracking-wider mb-2"
                >Email</label
              >
              <div class="relative rounded-xl shadow-sm">
                <div
                  class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500"
                >
                  <svg
                    class="h-5 w-5"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="1.8"
                      d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"
                    />
                  </svg>
                </div>
                <input
                  type="email"
                  id="loginEmail"
                  name="email"
                  placeholder="example@gmail.com"
                  required
                  class="block w-full pl-10 pr-4 py-3 bg-slate-950/70 border border-slate-800 rounded-xl text-slate-100 placeholder-slate-500 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/50 focus:border-amber-500 transition-all"
                  placeholder="ten@blueinvest.vn"
                />
              </div>
            </div>

            <!-- Password Input -->
            <div>
              <div class="flex items-center justify-between mb-2">
                <label
                  for="password"
                  class="block text-xs font-medium text-slate-300 uppercase tracking-wider"
                  >Mật khẩu</label
                >
                <a
                  href="#"
                  class="text-xs text-amber-400 hover:text-amber-300 transition-colors"
                  >Quên mật khẩu?</a
                >
              </div>
              <div class="relative rounded-xl shadow-sm">
                <div
                  class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500"
                >
                  <svg
                    class="h-5 w-5"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="1.8"
                      d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
                    />
                  </svg>
                </div>
                <input
                  type="password"
                  id="loginPassword"
                  name="password"
                  placeholder="••••••••••••"
                  required
                  class="block w-full pl-10 pr-4 py-3 bg-slate-950/70 border border-slate-800 rounded-xl text-slate-100 placeholder-slate-500 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/50 focus:border-amber-500 transition-all"
                />
              </div>
            </div>

            <!-- Submit Button -->
            <button
              type="submit"
              class="w-full py-3.5 px-4 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-bold rounded-xl shadow-lg shadow-amber-500/20 focus:outline-none focus:ring-2 focus:ring-amber-400 focus:ring-offset-2 focus:ring-offset-slate-900 transition-all transform active:scale-[0.99]"
            >
              Đăng nhập
            </button>
          </form>
        </div>

        <!-- Demo Account Card Info -->
        <div
          class="mt-6 p-4 rounded-xl bg-slate-900/40 border border-slate-800/60 text-center"
        >
          <p class="text-xs text-slate-400">
            <span class="font-medium text-slate-300">Tài khoản demo:</span>
            <code
              class="px-1.5 py-0.5 bg-slate-800 rounded text-amber-300 font-mono text-[11px] ml-1"
              >admin@blueinvest.vn</code
            >
            <span class="mx-1 text-slate-600">/</span>
            <code
              class="px-1.5 py-0.5 bg-slate-800 rounded text-amber-300 font-mono text-[11px]"
              >admin123</code
            >
          </p>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="w-full py-4 border-t border-slate-800/40 text-center">
      <p class="text-xs text-slate-500">
        &copy; 2026 Capital Circle. All rights reserved.
      </p>
    </footer>

    <script src="./js/auth.js"></script>
  </body>
</html>
